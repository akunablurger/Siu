name: Auto Login Gmail & Multi-Tab AI Studio (Matrix)

on:
  workflow_dispatch:
  # Menjalankan otomatisasi secara otomatis setiap 6 jam sekali
  schedule:
    - cron: '0 */6 * * *'

jobs:
  # Job pertama untuk membaca baris secret ACCOUNTS dan mengubahnya menjadi matrix array JSON
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Parse Accounts Secret into Matrix
        id: set-matrix
        env:
          ACCOUNTS_RAW: ${{ secrets.ACCOUNTS }}
        run: |
          # Ubah format enter ke bawah menjadi JSON array untuk matrix GitHub Actions
          python3 -c '
          import os, json
          raw = os.getenv("ACCOUNTS_RAW", "")
          lines = [line.strip() for line in raw.strip().split("\n") if line.strip() and ":" in line]
          print(f"Detected accounts: {len(lines)}")
          print(f"::set-output name=matrix::{json.dumps(lines)}")
          '

  # Job kedua menjalankan otomatisasi untuk masing-masing akun secara paralel via Matrix
  automation:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Login & Open 5 AI Studio Tabs
        env:
          CURRENT_ACCOUNT: ${{ matrix.account }}
          AI_STUDIO_URLS_SECRET: ${{ secrets.AI_STUDIO_URLS }}
        run: |
          python main.py
