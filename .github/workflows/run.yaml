name: Auto Login Gmail & Multi-Tab AI Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Parse accounts secret into matrix
        id: set-matrix
        env:
          ACCOUNTS_RAW: ${{ secrets.ACCOUNTS }}
        shell: bash
        run: |
          matrix_json=$(python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("ACCOUNTS_RAW", "")
          accounts = [
              line.strip()
              for line in raw.splitlines()
              if line.strip() and ":" in line
          ]
          if not accounts:
              raise SystemExit("ACCOUNTS tidak berisi baris email:password")
          print(json.dumps(accounts, separators=(",", ":")))
          PY
          )
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "Detected accounts: $(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$matrix_json")"

  automation:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run login and open AI Studio tabs
        env:
          CURRENT_ACCOUNT: ${{ matrix.account }}
          AI_STUDIO_URLS_SECRET: ${{ secrets.AI_STUDIO_URLS }}
          HEADLESS: "true"
        run: python main.py
