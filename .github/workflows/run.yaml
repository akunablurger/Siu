name: Auto Login Gmail & Open AI Studio

on:
  # Menjalankan otomatisasi secara manual dari tab Actions di GitHub
  workflow_dispatch:
  
  # (Opsional) Bisa di-set jadwal otomatis, misal tiap hari jam 7 pagi (Format UTC)
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  automation:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode dari repository Anda
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python versi terbaru
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies (Playwright & dotenv)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install browser Chromium khusus Playwright beserta dependensi sistemnya
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      # 5. Jalankan skrip Python dengan mengambil data dari GitHub Secrets
      - name: Run Automation Script
        env:
          ACCOUNTS_DATA: ${{ secrets.ACCOUNTS_DATA }}
        run: |
          python main.py
